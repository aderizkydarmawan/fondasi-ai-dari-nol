<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Belajar matematika, statistika, dan fisika di balik AI dari nol, dengan visualisasi interaktif, Python di browser, dan sumber yang bisa dicek.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%237ff0c5%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 text-anchor=%22middle%22 fill=%22%2306261a%22 font-family=%22serif%22%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<title>Fondasi AI dari Nol</title>
<meta name="theme-color" content="#0a0d13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Dunia: ruang kendali gelap. Permukaan biru-hitam, satu sinyal mint, teks terang yang enak dibaca lama. */
:root{
  color-scheme:dark;
  --bg:#0a0d13; --paper:#0a0d13; --sheet:#10151e; --raise:#151c28; --ink:#e5eaf2; --muted:#93a0b4; --line:#222b3a; --line2:#2e394c; --grid:#18202c;
  --accent:#7ff0c5; --accent-ink:#06261a; --accent-soft:rgba(127,240,197,.09); --accent-line:rgba(127,240,197,.32);
  --s1:#6f8cf5; --s2:#c47128; --warn:#f2b866; --warn-soft:rgba(242,184,102,.08); --ok:#7ff0c5; --mark:rgba(127,240,197,.2);
  --f-display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --topbar:56px;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--line2) var(--bg);-webkit-text-size-adjust:100%}
::selection{background:rgba(127,240,197,.28);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.72;caret-color:var(--accent);
  background-image:radial-gradient(rgba(147,160,180,.09) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}

header.top{position:sticky;top:0;z-index:20;height:var(--topbar);display:flex;align-items:center;gap:14px;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  background:rgba(10,13,19,.82);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand .mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.brand small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
.top .sp{flex:1}
#menuBtn{display:none;align-items:center;gap:8px;font:500 .88rem var(--f-display);background:var(--raise);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}

.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:272px minmax(0,1fr);gap:56px;
  padding:0 max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left))}
nav.toc{position:sticky;top:var(--topbar);align-self:start;max-height:calc(100vh - var(--topbar));overflow:auto;padding:28px 8px 40px 0;font-family:var(--f-display);font-size:.9rem;scrollbar-width:thin}
.layer{margin-bottom:22px}
.layer h3{font-size:.8rem;font-weight:600;color:var(--ink);margin:0 0 2px;padding:0 10px}
.layer p{margin:0 0 8px;padding:0 10px;font-size:.8rem;color:var(--muted);line-height:1.45}
.toc a,.toc span.soon{display:flex;gap:10px;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--muted);line-height:1.35;transition:background .2s var(--ease),color .2s var(--ease)}
.toc a:hover{background:var(--raise);color:var(--ink)}
.toc a.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.toc .num{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);min-width:2.6em;padding-top:1px;font-variant-numeric:tabular-nums}
.toc a.on .num{color:var(--accent)}
.toc .num .ico{font-size:.95rem}
.toc span.soon{opacity:.5}
.toc span.soon::after{content:"segera";margin-left:auto;font-size:.7rem;color:var(--muted)}

main{min-width:0;padding-top:44px}
article>*{max-width:70ch}
article h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.08;letter-spacing:-.035em;margin:0 0 .5em;text-wrap:balance}
article h2{font-family:var(--f-display);font-weight:600;font-size:1.4rem;letter-spacing:-.02em;line-height:1.25;margin:2.4em 0 .6em;text-wrap:balance}
article h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
article p,article li{color:#cfd6e2}
article b,article strong{color:var(--ink);font-weight:600}
.crumb{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:0 0 14px}
.crumb b{color:var(--accent);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);margin-bottom:1.8em}
.why{border:1px solid var(--accent-line);background:var(--accent-soft);padding:16px 20px;border-radius:12px;margin:1.6em 0}
.why b:first-child{display:block;color:var(--accent);font-family:var(--f-display);font-weight:600;margin-bottom:2px}
.rule{background:var(--sheet);border:1px solid var(--line2);border-radius:12px;padding:14px 20px;margin:1.4em 0}
.rule::before{content:"Aturan";display:block;font:600 .78rem var(--f-display);color:var(--accent);margin-bottom:4px}
.ex{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:1.5em 0}
.ex .q{font-weight:500;color:var(--ink)}
.ex .q::before{content:"Contoh soal";display:block;font:600 .78rem var(--f-display);color:var(--warn);margin-bottom:4px}
.ex .step{font-family:var(--f-mono);font-size:.9rem;white-space:pre-wrap;line-height:1.8;margin:.6em 0;overflow-x:auto;color:#c3cbd8;font-variant-numeric:tabular-nums}
.ex .ans{font-family:var(--f-display);font-weight:600;color:var(--ok)}
mark{background:var(--mark);color:var(--ink);padding:0 .2em;border-radius:3px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--raise);border:1px solid var(--line);padding:.08em .38em;border-radius:5px;color:#dfe6f0}
pre{font-family:var(--f-mono);font-size:.86rem;background:#080b10;border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow-x:auto;line-height:1.65;max-width:100%}
pre code{background:none;border:0;padding:0}
.tbl{overflow-x:auto;margin:1.4em 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.94rem}
th,td{border-bottom:1px solid var(--line);padding:8px 14px;text-align:center}
th{font-family:var(--f-display);font-weight:600;color:var(--ink);border-bottom-color:var(--line2)}
.big{font-family:var(--f-mono);font-size:1.12rem;text-align:center;padding:14px;margin:1.2em 0;overflow-x:auto;border-block:1px solid var(--line)}

.viz{border:1px solid var(--line2);border-radius:14px;background:var(--sheet);padding:16px 18px 18px;margin:2em 0;max-width:none;box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.viz-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-display)}
.viz-h b{font-size:.75rem;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:999px}
.viz-h span{font-size:1rem;font-weight:600}
.viz-c{display:flex;flex-wrap:wrap;gap:10px 22px;margin:14px 0;align-items:end}
.viz-c label{display:grid;gap:2px;font:500 .84rem var(--f-display);min-width:150px;flex:1 1 150px;color:var(--muted)}
.viz-c output{font-family:var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.viz-c input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.viz-c button,.runbtn,.tool{display:inline-flex;align-items:center;gap:7px;font:500 .84rem var(--f-display);background:var(--raise);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;transition:border-color .2s var(--ease),background .2s var(--ease)}
.viz-c button:hover,.runbtn:hover,.tool:hover{border-color:var(--accent-line)}
.viz-c button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.runbtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.runbtn:hover{background:#9af5d3}
.runbtn:disabled{opacity:.6;cursor:progress}
.viz svg{width:100%;height:auto;display:block;background:#0c1018;border:1px solid var(--line);border-radius:10px;user-select:none}
.viz-out{font-size:.95rem;margin-top:12px;line-height:1.6;color:#cfd6e2}
.viz .grid line{stroke:var(--grid);stroke-width:1}
.viz .axis line{stroke:#5d6a7e;stroke-width:1.2}
.viz .tick text{font:500 12px var(--f-mono);fill:var(--muted)}
.viz .lbl{font:500 12px var(--f-mono);fill:var(--ink)}
.viz .line{fill:none;stroke-width:2.5;stroke-linecap:round}
.viz .s1.line{stroke:var(--s1)} .viz .s2.line{stroke:var(--s2)} .viz .ink.line{stroke:var(--ink)}
.viz .dash{stroke-dasharray:7 5} .viz .thick{stroke-width:5}
.viz .faint.line{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}
.viz .guide{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4}
.viz .dot{stroke:#0c1018;stroke-width:2}
.viz .s1.dot,.viz .s1.fill{fill:var(--s1)} .viz .s2.dot,.viz .s2.fill{fill:var(--s2)} .viz .ink.dot,.viz .ink.fill{fill:var(--ink)}
.viz .handle{cursor:grab}
.viz .area{fill-opacity:.2;stroke-width:1.5} .viz .s1.area{fill:var(--s1);stroke:var(--s1)} .viz .s2.area{fill:var(--s2);stroke:var(--s2)}
.viz .cell{fill:var(--grid);stroke:var(--line2)}
.viz .s1t{fill:var(--s1)} .viz .s2t{fill:var(--s2)} .viz .faintt{fill:var(--muted)}

.dalam h2 small{font:500 .8rem var(--f-display);letter-spacing:0;color:var(--accent);display:block;margin-bottom:2px}
.box{border-radius:12px;padding:14px 20px;margin:1.4em 0;border:1px solid var(--line2);background:var(--sheet)}
.box::before{display:block;font:600 .8rem var(--f-display);margin-bottom:4px}
.box.salah{background:var(--warn-soft);border-color:rgba(242,184,102,.3)}
.box.salah::before{content:"Kesalahan yang sering terjadi";color:var(--warn)}
.box.ringkas::before{content:"Ringkasan";color:var(--s1)}
.box.uji{border-style:dashed;border-color:var(--accent-line)}
.box.uji::before{content:"Tes kertas kosong";color:var(--accent)}
.box ul{margin:.3em 0;padding-left:1.2em}
.box p.note{font-size:.88rem;color:var(--muted);margin:.5em 0 0}
.runbar{display:flex;gap:10px;align-items:center;margin:-.5em 0 1.1em;flex-wrap:wrap}
.runbar small{color:var(--muted);font-size:.8rem}
pre.hasil{border-style:dashed;border-color:var(--accent-line);white-space:pre-wrap;color:var(--accent)}

/* Panggung diagram */
.stage{position:relative;max-width:none;margin:1.2em 0 .4em;border:1px solid var(--line2);border-radius:14px;background:#0c1018;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.stage-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sheet);flex-wrap:wrap}
.stage-bar .title{font:600 .9rem var(--f-display);margin-right:auto;padding-left:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-bar .z{font:500 .8rem var(--f-mono);color:var(--muted);min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.tool{padding:6px 9px;min-height:34px;min-width:34px;justify-content:center}
.tool.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.stage-view{overflow:auto;height:var(--sh,560px);overscroll-behavior:contain;cursor:grab;scrollbar-width:thin}
.stage-view.drag{cursor:grabbing}
.stage-sizer{position:relative}
.peta-frame{width:1280px;height:900px;border:0;display:block;transform-origin:0 0;position:absolute;left:0;top:0;background:#0c1018}
.stage:fullscreen,.stage.max{border-radius:0;border:0;margin:0;display:flex;flex-direction:column}
.stage:fullscreen .stage-view,.stage.max .stage-view{height:auto;flex:1}
.stage.max{position:fixed;inset:0;z-index:100}
.stage-hint{font-size:.85rem;color:var(--muted);margin:.2em 0 1.6em}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:1.4em 0 .4em;max-width:none}
.tabs .grp{font:500 .78rem var(--f-display);color:var(--muted);align-self:center;margin:0 4px 0 0;min-width:3.6em}
.tabs .sep{flex-basis:100%;height:0}
.tabs button{font:500 .84rem var(--f-display);background:var(--sheet);color:#cfd6e2;border:1px solid var(--line2);border-radius:999px;padding:6px 13px;cursor:pointer;min-height:34px;transition:all .2s var(--ease)}
.tabs button:hover{border-color:var(--accent-line);color:var(--ink)}
.tabs button span{color:var(--muted);font-family:var(--f-mono);font-size:.76rem}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs button[aria-pressed=true] span{color:var(--accent-ink);opacity:.7}

.langkah{position:relative;padding:0 0 26px 44px;margin:0;max-width:72ch}
.langkah::before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--accent-line);color:var(--accent);font:500 .8rem/26px var(--f-mono);text-align:center}
.langkah::after{content:"";position:absolute;left:14px;top:32px;bottom:4px;width:1px;background:var(--line2)}
.langkah:last-of-type::after{display:none}
.langkah h3{font-size:1.05rem;margin:2px 0 6px}
.langkah .cat{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.kol{display:grid;gap:6px;margin:6px 0 10px}
.kol>b{font:500 .78rem var(--f-display);color:var(--muted);margin-top:4px}
details.mod{border:1px solid var(--line);border-radius:10px;background:var(--sheet);transition:border-color .2s var(--ease)}
details.mod:hover,details.mod[open]{border-color:var(--line2)}
details.mod summary{cursor:pointer;padding:9px 14px;font-family:var(--f-display);font-weight:500;list-style:none;display:flex;gap:10px;align-items:baseline;color:var(--ink)}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary::after{content:"+";margin-left:auto;color:var(--muted);font-family:var(--f-mono)}
details.mod[open] summary::after{content:"−"}
details.mod summary code{background:none;border:0;padding:0;font-weight:500;color:var(--kc);display:inline-flex;align-items:center;gap:7px;min-width:3.4em}
details.mod summary code::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kc)}
details.mod .mi{padding:2px 16px 14px;font-size:.94rem}
details.mod .mi ul{padding-left:1.2em;margin:.3em 0}
details.mod .ai{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:8px 12px;margin:6px 0 10px;font-size:.92rem}
.k-M{--kc:#4fd1a5}.k-S{--kc:#a993f5}.k-F{--kc:#e0a64b}.k-K{--kc:#f08a5d}.k-B{--kc:#5fb4ec}.k-C{--kc:#9aa8bb}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;color:var(--muted);margin:.6em 0 1.6em}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--kc);margin-right:6px}
.mi .cablink{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0;font:500 .85rem var(--f-display);color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.mi .cablink:hover{text-decoration:underline}

.src{border-top:1px solid var(--line);margin-top:2.6em;padding-top:1.1em;font-size:.9rem}
.src::before{content:"Sumber dan bacaan lanjut";display:block;font:600 .8rem var(--f-display);color:var(--ink);margin-bottom:6px}
.src li{margin:.35em 0;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:3em;max-width:none}
.pager a{display:block;font-family:var(--f-display);font-weight:500;text-decoration:none;color:var(--ink);border:1px solid var(--line2);background:var(--sheet);border-radius:12px;padding:14px 18px;transition:border-color .2s var(--ease),transform .3s var(--ease)}
.pager a:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.pager a small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-bottom:2px}
.pager a:last-child{text-align:right}
.pager a:only-child{grid-column:2}

/* Beranda */
.home h1{font-size:clamp(2.4rem,6vw,4.2rem);max-width:16ch}
.home .lede{font-size:1.15rem;color:#cfd6e2;max-width:58ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:1.8em 0 2.4em}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 .95rem var(--f-display);text-decoration:none;border-radius:10px;padding:11px 18px;border:1px solid var(--line2);color:var(--ink);background:var(--raise);transition:all .2s var(--ease)}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#9af5d3}
.lay-list{list-style:none;padding:0;margin:1em 0 0;max-width:none;border-top:1px solid var(--line)}
.lay-list li{display:grid;grid-template-columns:4.5em minmax(0,15em) minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lay-list .n{font-family:var(--f-mono);font-size:.82rem;color:var(--accent)}
.lay-list b{font-family:var(--f-display);font-weight:600}
.lay-list span{font-size:.92rem;color:var(--muted);line-height:1.55}
.steps-howto{counter-reset:h;list-style:none;padding:0}
.steps-howto li{counter-increment:h;position:relative;padding-left:2.4em;margin:.6em 0}
.steps-howto li::before{content:counter(h);position:absolute;left:0;top:.15em;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--line2);font:500 .78rem/1.5em var(--f-mono);text-align:center;color:var(--muted)}

a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  #menuBtn{display:inline-flex}
  .brand small{display:none}
  nav.toc{position:fixed;inset:var(--topbar) 0 0 0;max-height:none;z-index:15;background:var(--bg);padding:20px 16px 40px;display:none}
  nav.toc.open{display:block}
  main{padding-top:28px}
  .lay-list li{grid-template-columns:3.6em minmax(0,1fr)}
  .lay-list span{grid-column:2}
  .pager{grid-template-columns:1fr}
  .pager a:last-child{text-align:left}.pager a:only-child{grid-column:1}
}
</style>

</head>
<body>
<header class="top">
  <a class="brand" href="#beranda"><span class="mark"><svg class="ico" viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></svg></span>Fondasi AI dari Nol<small>matematika · statistika · fisika</small></a>
  <span class="sp"></span>
  <button id="menuBtn" type="button" aria-expanded="false" aria-controls="toc"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Daftar isi</button>
</header>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="Daftar pelajaran"></nav>
  <main><article id="view"></article></main>
</div>

<script src="kurikulum.js"></script>
<script src="lapis0.js"></script>
<script src="lapis1.js"></script>
<script src="dalam.js"></script>
<script src="viz.js"></script>
<script src="peta.js"></script>
<script src="cabang.js"></script>
<script>
(function(){
  var I = {
    home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
    play:'<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
    ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
    full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    exitfull:'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
    fit:'<path d="M3 12h4M17 12h4M12 3v4M12 17v4"/><rect x="8" y="8" width="8" height="8" rx="1"/>',
    up:'<path d="M12 19V5M6 11l6-6 6 6"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  function ico(n){ return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+I[n]+'</svg>'; }
  var L = window.LESSONS || {};
  var toc = document.getElementById('toc'), view = document.getElementById('view');
  var order = [];
  window.KURIKULUM.forEach(function(lay){ lay.items.forEach(function(it){ if(L[it.id]) order.push(it.id); }); });

  function slug(id){ return 'p' + id.replace(/\./g,'-'); }
  function idFromHash(){ var h = location.hash.slice(1); if(!h || h==='beranda') return null; var id = h.replace(/^p/,'').replace(/-/g,'.'); return L[id] ? id : null; }

  function buildToc(cur){
    var isPeta = location.hash === '#peta';
    var html = '<div class="layer"><a href="#beranda" class="'+(cur||isPeta?'':'on')+'"><span class="num">'+ico('home')+'</span>Beranda &amp; cara belajar</a><a href="#peta" class="'+(isPeta?'on':'')+'"><span class="num">'+ico('map')+'</span>Peta belajar lengkap</a></div>';
    window.KURIKULUM.forEach(function(lay){
      html += '<div class="layer"><h3>'+lay.name+'</h3><p>'+lay.desc+'</p>';
      lay.items.forEach(function(it){
        if(L[it.id]) html += '<a href="#'+slug(it.id)+'" class="'+(cur===it.id?'on':'')+'"><span class="num">'+it.id+'</span>'+it.t+'</a>';
        else html += '<span class="soon"><span class="num">'+it.id+'</span>'+it.t+'</span>';
      });
      html += '</div>';
    });
    toc.innerHTML = html;
  }

  function home(){
    var n = order.length, total = 0;
    window.KURIKULUM.forEach(function(l){ total += l.items.length; });
    var rows = window.KURIKULUM.map(function(l, i){ return '<li><span class="n">Lapis '+i+'</span><b>'+l.name.replace(/^Lapis\s*\d+\s*[:·—–-]?\s*/,'')+'</b><span>'+l.desc+'</span></li>'; }).join('');
    var last = null; try{ last = localStorage.getItem('fondasi-terakhir'); }catch(e){}
    if(last && !L[last]) last = null;
    view.className = 'home';
    view.innerHTML =
      '<h1>Matematika di balik AI, dari menghitung sampai difusi</h1>'+
      '<p class="lede">Semua fondasi yang dipakai AI, diajarkan dari nol. Tiap pelajaran punya penjelasan, contoh soal langkah demi langkah, visualisasi yang bisa kamu geser, dan Python yang jalan langsung di browser.</p>'+
      '<div class="cta">'+
        (last ? '<a class="btn primary" href="#'+slug(last)+'">Lanjutkan '+last+' · '+L[last].title+ico('arrow')+'</a>' : (order[0] ? '<a class="btn primary" href="#'+slug(order[0])+'">Mulai dari '+order[0]+' · '+L[order[0]].title+ico('arrow')+'</a>' : ''))+
        '<a class="btn" href="#peta">'+ico('map')+'Lihat peta belajar</a>'+
      '</div>'+
      '<div class="why"><b>Satu ide yang mengikat semuanya</b>Hampir setiap teknik AI meminjam dari ilmu lain: CNN dari pengolahan sinyal, Mamba dari teori kendali, model difusi dari fisika statistik, dan attention dari probabilitas. Kalau fondasinya kuat, arsitektur baru terasa seperti teman lama.</div>'+
      '<h2>Enam lapis</h2><ol class="lay-list">'+rows+'</ol>'+
      '<p class="meta" style="margin-top:1em">'+n+' dari '+total+' pelajaran sudah tersedia. Sisanya ditambahkan bertahap ke alamat yang sama.</p>'+
      '<h2>Cara belajar yang disarankan</h2>'+
      '<ol class="steps-howto"><li>Baca satu pelajaran per sesi, pelan-pelan.</li><li>Mainkan bagian <b>Coba sendiri</b>: geser, seret, dan lihat angkanya berubah.</li><li>Tutup jawaban contoh soal, kerjakan di kertas, lalu bandingkan.</li><li>Tekan <b>Jalankan</b> untuk memeriksa dengan Python asli.</li><li>Kerjakan <b>Tes kertas kosong</b> tanpa melihat catatan. Latihan soal minta terpisah ke Claude.</li></ol>'+
      '<p>Setiap pelajaran ditutup dengan daftar <b>sumber</b> (buku, bab, halaman) supaya semua yang ditulis bisa kamu periksa sendiri.</p>';
  }

  function dalam(id){
    var d = (window.DALAM||{})[id]; if(!d) return '';
    function li(a){ return '<ul>'+a.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>'; }
    return '<section class="dalam">'+
      (d.viz ? '<div class="viz" data-viz="'+d.viz+'"></div>' : '')+
      '<h2><small>Pendalaman</small>Lebih dalam</h2>'+d.deep+
      '<div class="box salah">'+li(d.salah)+'</div>'+
      '<div class="box ringkas">'+li(d.ringkas)+'</div>'+
      '<div class="box uji">'+li(d.uji)+'<p class="note">Tutup halaman ini, kerjakan di kertas, baru cek. Mengingat tanpa melihat membuat ingatan lebih awet daripada membaca ulang (Roediger &amp; Butler, 2011). Minta soal latihan tambahan ke Claude.</p></div>'+
    '</section>';
  }

  /* Python di browser (Pyodide), dimuat hanya saat tombol pertama ditekan */
  var pyReady = null;
  function loadPy(){
    if(pyReady) return pyReady;
    pyReady = new Promise(function(res, rej){
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
      sc.onload = function(){ loadPyodide().then(function(py){ return py.loadPackage('numpy').then(function(){ res(py); }); }).catch(rej); };
      sc.onerror = function(){ pyReady = null; rej(new Error('Gagal memuat Python')); };
      document.head.appendChild(sc);
    });
    return pyReady;
  }
  function addRunners(root){
    [].forEach.call(root.querySelectorAll('pre > code'), function(code){
      var src = code.textContent;
      if(/^\s*>>>/m.test(src) || !/print\(/.test(src)) return;
      var bar = document.createElement('div'); bar.className = 'runbar';
      bar.innerHTML = '<button type="button" class="runbtn">'+ico('play')+'<span>Jalankan</span></button><small>Python asli di browser. Pemuatan pertama sekitar 10 detik.</small>';
      code.parentNode.after(bar);
      var out = null;
      bar.querySelector('button').addEventListener('click', function(){
        var b = this; var t = b.querySelector('span'); b.disabled = true; t.textContent = 'Memuat Python…';
        loadPy().then(function(py){
          var buf = [];
          py.setStdout({batched:function(t){buf.push(t);}}); py.setStderr({batched:function(t){buf.push(t);}});
          try { py.runPython(src); } catch(e){ buf.push(String(e.message||e).split('\n').slice(-3).join('\n')); }
          if(!out){ out = document.createElement('pre'); out.className = 'hasil'; bar.after(out); }
          out.textContent = buf.join('\n') || '(tidak ada output)';
          b.disabled = false; t.textContent = 'Jalankan lagi';
        }).catch(function(e){ b.disabled = false; t.textContent = 'Coba lagi'; bar.querySelector('small').textContent = e.message + '. Cek koneksi internet.'; });
      });
    });
  }

  function peta(){
    var P = window.PETA; view.className = '';
    function mod(id){
      var m = P.modul[id]; if(!m) return '';
      return '<details class="mod k-'+id[0]+'"><summary><code>'+id+'</code> '+m.judul+(m.catatan?' <small style="color:var(--muted);font-weight:500">'+m.catatan+'</small>':'')+'</summary><div class="mi">'+
        (m.ai ? '<div class="ai"><b>Untuk AI:</b> '+m.ai+'</div>' : '')+m.isi+
        (cabangOf(id) ? '<button type="button" class="cablink" data-d="cabang/'+cabangOf(id).slug+'.html">'+ico('up')+'Lihat diagram cabang '+id+'</button>' : '')+'</div></details>';
    }
    function cabangOf(id){ return (window.CABANG||[]).filter(function(c){ return c.mods.indexOf(id) >= 0; })[0]; }
    function kol(t, ids){ return ids.length ? '<div class="kol"><b>'+t+'</b>'+ids.map(mod).join('')+'</div>' : ''; }
    var steps = P.langkah.map(function(l, i){
      return '<div class="langkah" data-n="'+(i+1)+'"><h3>Langkah '+(i+1)+'</h3>'+(l.cat?'<p class="cat">'+l.cat+'</p>':'')+
        kol('Pilar fondasi', l.p)+kol('Bangun sendiri', l.b)+kol('Dunia nyata', l.c)+'</div>';
    }).join('');
    view.innerHTML =
      '<h1>Peta belajar: dari matematika sampai AI</h1>'+
      '<p>Mulai dari <b>Global</b> untuk melihat gambaran besar 6 tahap. Lalu buka <b>cabang</b> untuk melihat isi tiap modul secara rinci: satu baris adalah satu modul, dan kotak-kotaknya adalah topik yang dipelajari berurutan sampai tes lulus.</p>'+
      '<div class="tabs" role="group" aria-label="Pilih diagram"><span class="grp">Global</span><button type="button" data-d="peta-urutan.html" aria-pressed="true">Semua pilar · 6 tahap</button><span class="sep"></span><span class="grp">Cabang</span>'+
        (window.CABANG||[]).map(function(c){ return '<button type="button" data-d="cabang/'+c.slug+'.html" aria-pressed="false" title="'+c.title+'">'+c.title.split(':')[0]+' <span>'+c.mods[0]+'–'+c.mods[c.mods.length-1]+'</span></button>'; }).join('')+
      '</div>'+
      '<div class="stage" id="stage"><div class="stage-bar"><span class="title" id="stageTitle">Semua pilar · 6 tahap</span>'+
        '<button type="button" class="tool" data-z="-1" aria-label="Perkecil">'+ico('minus')+'</button><span class="z" id="stageZ">100%</span><button type="button" class="tool" data-z="1" aria-label="Perbesar">'+ico('plus')+'</button>'+
        '<button type="button" class="tool" data-z="0" aria-label="Pas ke layar">'+ico('fit')+'</button>'+
        '<a class="tool" id="petaFull" href="peta-urutan.html" target="_blank" rel="noopener" aria-label="Buka di tab baru">'+ico('ext')+'</a>'+
        '<button type="button" class="tool primary" id="stageFs">'+ico('full')+'<span>Layar penuh</span></button></div>'+
        '<div class="stage-view" id="stageView"><div class="stage-sizer" id="stageSizer"><iframe class="peta-frame" id="petaFrame" src="peta-urutan.html" title="Diagram peta belajar"></iframe></div></div></div>'+
      '<p class="stage-hint" id="petaDesc">Kolom = tahap (kiri ke kanan), baris = pilar. Tombol Jalur dan Lensa di pojok diagram membantu menelusuri. Seret untuk menggeser, Esc untuk keluar dari layar penuh.</p>'+
      '<h2>Urutan rinci: 14 langkah</h2>'+
      '<p>Inilah urutan sebenarnya, lebih rinci daripada diagram. Setiap langkah mengerjakan beberapa pilar sekaligus (berselang-seling), lalu membangun satu benda AI, lalu memakainya di data nyata. Klik nama modul untuk melihat isi, sumber, dan tes lulusnya.</p>'+
      '<p class="legend"><span class="k-M"><i></i>M matematika</span><span class="k-S"><i></i>S statistika</span><span class="k-F"><i></i>F fisika</span><span class="k-K"><i></i>K komputasi</span><span class="k-B"><i></i>B bangun AI</span><span class="k-C"><i></i>C dunia nyata</span></p>'+
      steps+
      '<h2>Kapan boleh bilang "selesai"</h2><ol>'+P.selesai.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ol>'+
      '<div class="src"><ul><li>Urutan dan isi modul: PANDUAN-JALUR-INTI.md versi 2 (30 Okt 2026), hasil dua sesi council dan cek silang dengan silabus MIT 18.02, 18.05, 18.06, 8.333, dan Stanford CS229.</li><li>Diagram dibuat dengan Archify dan lolos validasi otomatis (validate, deliver, check, browser-check).</li></ul></div>'+
      '<div class="pager" id="petaEnd"><a href="#beranda"><small>←</small>Beranda</a>'+(order[0]?'<a href="#'+slug(order[0])+'"><small>Mulai belajar →</small>'+order[0]+' · '+L[order[0]].title+'</a>':'')+'</div>';
  }

  function bindPeta(){
    var fr = document.getElementById('petaFrame'), full = document.getElementById('petaFull'), desc = document.getElementById('petaDesc');
    var st = document.getElementById('stage'), sv = document.getElementById('stageView'), sz = document.getElementById('stageSizer');
    var zl = document.getElementById('stageZ'), fsb = document.getElementById('stageFs'), ttl = document.getElementById('stageTitle');
    if(!fr) return;
    var W = 1280, H = 900, k = 1, fitted = true;
    function isFs(){ return document.fullscreenElement === st || st.classList.contains('max'); }
    function fitK(){ var w = sv.clientWidth, h = isFs() ? sv.clientHeight : Infinity; return Math.max(.3, Math.min(w / W, h / H, isFs() ? 2 : 1)); }
    function apply(nk, keepCenter){
      var cx = (sv.scrollLeft + sv.clientWidth/2) / (W*k), cy = (sv.scrollTop + sv.clientHeight/2) / (H*k);
      k = Math.max(.3, Math.min(3, nk));
      fr.style.transform = 'scale('+k+')'; sz.style.width = (W*k)+'px'; sz.style.height = (H*k)+'px';
      if(!isFs()) st.style.setProperty('--sh', Math.min(H*k, window.innerHeight*.78)+'px');
      if(keepCenter){ sv.scrollLeft = cx*W*k - sv.clientWidth/2; sv.scrollTop = cy*H*k - sv.clientHeight/2; }
      zl.textContent = Math.round(k*100)+'%';
    }
    function fit(){
      fitted = true;
      /* layar penuh: diagram memakai seluruh layar dengan ukuran aslinya; mode biasa: kanvas 1280x900 diperkecil */
      if(isFs()){ W = sv.clientWidth; H = sv.clientHeight; } else { W = 1280; H = 900; }
      fr.style.width = W+'px'; fr.style.height = H+'px';
      apply(isFs() ? 1 : fitK(), false); sv.scrollLeft = 0; sv.scrollTop = 0;
    }
    function theme(){ try{ var d = fr.contentDocument; if(d && d.documentElement){ d.documentElement.setAttribute('data-theme','dark'); d.documentElement.style.colorScheme = 'dark'; d.documentElement.style.background = '#0c1018'; } }catch(e){} }
    fr.addEventListener('load', theme); theme();
    function pick(d, scroll){
      fr.src = d; full.href = d;
      var lab = 'Semua pilar · 6 tahap';
      [].forEach.call(view.querySelectorAll('.tabs button'), function(b){ var on = b.getAttribute('data-d') === d; b.setAttribute('aria-pressed', on); if(on) lab = b.getAttribute('title') || b.textContent; });
      ttl.textContent = lab;
      desc.textContent = (d.indexOf('cabang/') === 0 ? 'Satu baris = satu modul. Kotak dibaca dari kiri ke kanan; kotak paling kanan biasanya tes lulus atau jembatan ke modul berikutnya.' : 'Kolom = tahap (kiri ke kanan), baris = pilar. Tombol Jalur dan Lensa di pojok diagram membantu menelusuri.') + ' Seret untuk menggeser, Esc untuk keluar dari layar penuh.';
      fit();
      if(scroll) view.querySelector('.tabs').scrollIntoView({behavior:'smooth'});
    }
    function setFsUi(){ var on = isFs(); fsb.innerHTML = ico(on?'exitfull':'full')+'<span>'+(on?'Keluar':'Layar penuh')+'</span>'; requestAnimationFrame(fit); }
    fsb.addEventListener('click', function(){
      if(isFs()){ if(document.fullscreenElement) document.exitFullscreen(); else { st.classList.remove('max'); document.body.style.overflow=''; setFsUi(); } return; }
      if(st.requestFullscreen) st.requestFullscreen().catch(function(){ st.classList.add('max'); document.body.style.overflow='hidden'; setFsUi(); });
      else { st.classList.add('max'); document.body.style.overflow='hidden'; setFsUi(); }
    });
    document.addEventListener('fullscreenchange', function(){ if(document.getElementById('stage') === st) setFsUi(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && st.classList.contains('max')){ st.classList.remove('max'); document.body.style.overflow=''; setFsUi(); } });
    [].forEach.call(st.querySelectorAll('[data-z]'), function(b){ b.addEventListener('click', function(){ var z = +b.getAttribute('data-z'); if(!z) return fit(); fitted = false; apply(k * (z > 0 ? 1.25 : 0.8), true); }); });
    /* seret untuk menggeser: lapisan tipis hanya saat tombol ditekan, supaya klik di diagram tetap jalan */
    var drag = null;
    sv.addEventListener('pointerdown', function(e){ if(e.target !== sv && e.target !== sz) return; drag = {x:e.clientX, y:e.clientY, l:sv.scrollLeft, t:sv.scrollTop}; sv.classList.add('drag'); sv.setPointerCapture(e.pointerId); });
    sv.addEventListener('pointermove', function(e){ if(!drag) return; sv.scrollLeft = drag.l - (e.clientX - drag.x); sv.scrollTop = drag.t - (e.clientY - drag.y); });
    sv.addEventListener('pointerup', function(){ drag = null; sv.classList.remove('drag'); });
    fit();
    window.removeEventListener('resize', window._petaFit || fit); window._petaFit = function(){ if(fitted && document.getElementById('stage')) fit(); }; window.addEventListener('resize', window._petaFit);
    window._petaPick = pick;
    if(!window._petaBound){
      window._petaBound = true;
      view.addEventListener('click', function(e){
        var b = e.target.closest('[data-d]'); if(!b || !document.getElementById('petaFrame')) return;
        window._petaPick(b.getAttribute('data-d'), b.classList.contains('cablink'));
      });
    }
  }

  function show(id){
    var x = L[id], i = order.indexOf(id), prev = order[i-1], next = order[i+1];
    view.className = '';
    view.innerHTML =
      '<div class="crumb">Pelajaran <b>'+id+'</b></div><h1>'+x.title+'</h1>'+
      '<div class="meta"><span>Prasyarat: '+x.pre+'</span></div>'+
      '<div class="why"><b>Kenapa penting untuk AI?</b>'+x.why+'</div>'+ x.body +
      dalam(id) +
      (x.src ? '<div class="src"><ul>'+x.src.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ul></div>' : '')+
      '<div class="pager">'+
        (prev ? '<a href="#'+slug(prev)+'"><small>← Sebelumnya</small>'+prev+' · '+L[prev].title+'</a>' : '<a href="#beranda"><small>←</small>Beranda</a>')+
        (next ? '<a href="#'+slug(next)+'"><small>Berikutnya →</small>'+next+' · '+L[next].title+'</a>' : '<span></span>')+
      '</div>';
    if(window.mountViz) window.mountViz(view);
    addRunners(view);
  }

  function route(){
    var id = idFromHash();
    buildToc(id);
    if(id) show(id); else if(location.hash==='#peta') { peta(); bindPeta(); } else home();
    toc.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    window.scrollTo(0,0);
    try{ if(id) localStorage.setItem('fondasi-terakhir', id); }catch(e){}
  }
  var btn = document.getElementById('menuBtn');
  btn.addEventListener('click', function(){ var o = toc.classList.toggle('open'); btn.setAttribute('aria-expanded', o?'true':'false'); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
