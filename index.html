<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Belajar matematika, statistika, dan fisika di balik AI dari nol, dengan visualisasi interaktif, Python di browser, dan sumber yang bisa dicek.">
<meta name="theme-color" content="#120d1d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23120d1d%22/%3E%3Ctext x=%2216%22 y=%2224%22 font-size=%2222%22 text-anchor=%22middle%22 fill=%22%23c9b8ff%22 font-family=%22serif%22 font-style=%22italic%22%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<title>Batu yang Memahat Dirinya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* Dunia: jurnal sains di malam hari. Ungu gelap, lavender untuk sinyal, cyan sebagai pendamping. Serif di mana-mana; mono hanya untuk kode. */
:root{
  color-scheme:dark;
  --bg:#120d1d; --paper:#120d1d; --sheet:#181226; --raise:#201834; --ink:#efeaf8; --text:#d9d2e8; --muted:#a69cbd;
  --line:rgba(201,184,255,.13); --line2:rgba(201,184,255,.24); --grid:rgba(201,184,255,.05);
  --accent:#c9b8ff; --accent-ink:#1a1030; --accent-soft:rgba(201,184,255,.08); --accent-line:rgba(201,184,255,.4);
  --cyan:#7fd8f2; --cyan-soft:rgba(127,216,242,.08);
  --s1:#b8a4ff; --s2:#6fd0ee; --warn:#f2c48a; --ok:#7fd8f2; --mark:rgba(201,184,255,.2);
  --f-display:"Instrument Serif", "Times New Roman", serif;
  --f-body:"Source Serif 4", Georgia, serif;
  --f-mono:"JetBrains Mono", Consolas, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(16px,4vw,48px);
}
*{box-sizing:border-box}
html{scrollbar-color:#3a2d57 var(--bg);-webkit-text-size-adjust:100%}
::selection{background:rgba(201,184,255,.32);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3a2d57;border:2px solid var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.7;caret-color:var(--accent);overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
p,li{text-wrap:pretty}
#view pre{max-width:100%;overflow-x:auto}
@media (max-width:600px){ #view pre{font-size:clamp(.6rem,2.6vw,.85rem)} }
.meta a{text-decoration:none;border-bottom:1px solid var(--accent-line)} .meta a .ico{width:.8em;height:.8em;color:var(--cyan)}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
#bgf{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glowbg{position:fixed;inset:-20vh -10vw auto auto;width:70vw;height:70vh;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(150,110,255,.16),transparent);filter:blur(10px)}
.shell{position:relative;z-index:1}

/* Bilah atas */
#bar{position:fixed;top:0;left:0;right:0;z-index:30;height:60px;display:flex;align-items:center;gap:22px;padding:0 var(--gut);
  background:rgba(18,13,29,.9);border-bottom:1px solid var(--line);transition:transform .45s var(--ease)}
#bar.hide{transform:translateY(-100%)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.45rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand i{font-style:italic;color:var(--accent)}
#bar .sp{flex:1}
#bar nav{display:flex;gap:4px;align-items:center}
.navb{font:400 1rem var(--f-body);color:var(--text);background:none;border:0;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.navb:hover,.navb[aria-current=page]{color:var(--ink)}
.navb[aria-current=page]{box-shadow:inset 0 -1px 0 var(--accent)}
.navb.cta{white-space:nowrap;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 16px}
.navb.cta:hover{background:#ddd1ff}
.navb.cta .ls{display:none}
@media (max-width:480px){ .navb.cta .lw{display:none} .navb.cta .ls{display:inline} #menuBtn{font-size:0;gap:0;padding:8px 10px} #menuBtn .ico{font-size:1.25rem} }
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--cyan);z-index:31;box-shadow:0 0 12px rgba(127,216,242,.7)}

/* Panel menu layar penuh */
#menu{position:fixed;inset:0;z-index:40;background:rgba(14,10,23,.97);overflow:auto;padding:28px var(--gut) 60px;
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
#menu.open{opacity:1;visibility:visible}
#menu .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
#menu .mh h2{font:400 clamp(2rem,4vw,3rem)/1 var(--f-display);color:var(--ink);margin:0}
#menu .mh h2 i{color:var(--accent)}
#menu .x{font:400 1rem var(--f-body);color:var(--ink);background:var(--raise);border:1px solid var(--line2);padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:40px 48px;max-width:1400px}
.mlay h3{font:400 1.6rem/1.15 var(--f-display);color:var(--ink);margin:0 0 4px}
.mlay h3 em{color:var(--accent)}
.mlay p{font-size:.92rem;color:var(--muted);margin:0 0 12px;line-height:1.5}
.mlay a,.mlay span.soon{display:flex;gap:12px;padding:6px 0;color:var(--text);text-decoration:none;line-height:1.35;font-size:1rem;transform:translateY(8px);opacity:0;transition:transform .5s var(--ease),opacity .5s var(--ease),color .2s}
#menu.open .mlay a,#menu.open .mlay span.soon{transform:none;opacity:1}
.mlay a:hover{color:var(--accent)}
.mlay a.on{color:var(--accent)}
.mlay .n{font-family:var(--f-display);font-style:italic;color:var(--muted);min-width:2em;font-size:1.05rem}
.mlay .ck{margin-left:auto;color:var(--cyan)}
.mlay span.soon{opacity:0;color:var(--muted)}
#menu.open .mlay span.soon{opacity:.45}
.mtop{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 36px}

/* Kerangka halaman */
main{position:relative;min-height:100vh;padding:110px var(--gut) 120px}
.page{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:64px}
.page.solo{grid-template-columns:minmax(0,1fr)}
article{min-width:0;position:relative}
article>*{max-width:80ch}
aside.otl{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;font-size:.92rem}
aside.otl b{display:block;font:400 1.15rem var(--f-display);color:var(--ink);margin-bottom:8px}
aside.otl a{display:block;padding:5px 0 5px 14px;color:var(--muted);text-decoration:none;line-height:1.35;box-shadow:inset 1px 0 0 var(--line);transition:color .2s,box-shadow .2s}
aside.otl a:hover{color:var(--ink)}
aside.otl a.on{color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.enter{animation:enter .7s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

article h1{font:400 clamp(2.8rem,6.5vw,5.4rem)/1 var(--f-display);color:var(--ink);letter-spacing:-.02em;margin:0 0 .35em;text-wrap:balance;position:relative}
article h1 em{color:var(--accent)}
article h2{font:400 clamp(1.8rem,3vw,2.4rem)/1.1 var(--f-display);color:var(--ink);letter-spacing:-.01em;margin:2.4em 0 .5em;text-wrap:balance;scroll-margin-top:90px}
article h3{font:600 1.1rem var(--f-body);color:var(--ink)}
article b,article strong{color:var(--ink);font-weight:600}
.chap{position:absolute;right:-.05em;top:-.42em;font:italic 400 clamp(9rem,22vw,19rem)/1 var(--f-display);color:rgba(201,184,255,.07);pointer-events:none;user-select:none;z-index:-1;max-width:none}
.crumb{font-style:italic;color:var(--muted);margin:0 0 .6em;font-size:1rem}
.crumb b{color:var(--accent);font-weight:400}
.meta{color:var(--muted);font-size:.95rem;margin:0 0 2em}

/* Catatan margin: label di kolom kiri, isi di kanan */
.why,.rule,.ex,.box,.src{position:relative;padding:14px 0 14px 10.5rem;margin:2em 0;border-top:1px solid var(--line)}
.why b:first-child,.rule::before,.ex::before,.box::before,.src::before{position:absolute;left:0;top:14px;width:9.2rem;font:italic 400 1.18rem/1.25 var(--f-display);color:var(--accent)}
.why{border-top-color:var(--accent-line)}
.why b:first-child{font-weight:400}
.rule::before{content:"Aturan"}
.rule{color:var(--ink)}
.ex::before{content:"Contoh soal";color:var(--cyan)}
.ex .q{font-weight:600;color:var(--ink)}
.ex .step{font-family:var(--f-body);white-space:pre-wrap;line-height:1.8;margin:.5em 0;overflow-x:auto;color:var(--text);font-variant-numeric:tabular-nums lining-nums}
.ex .ans{font-style:italic;color:var(--cyan)}
.anat{margin:2em 0}.anat iframe{display:block;width:100%;height:760px;border:0;background:#111}
.ex details.answ summary{cursor:pointer;color:var(--accent);font:italic 400 1rem var(--f-body);min-height:24px;display:inline-flex;align-items:center}
.ex details.answ summary:focus-visible,.mi .cablink:focus-visible,.viz .handle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:12px;top:-60px;z-index:999;background:var(--accent);color:var(--bg);padding:8px 14px;text-decoration:none}
.skip:focus{top:12px}
.box.salah::before{content:"Kesalahan yang sering terjadi";color:var(--warn)}
.box.ringkas::before{content:"Ringkasan"}
.box.uji::before{content:"Tes kertas kosong";color:var(--cyan)}
.box ul{margin:0;padding-left:1.1em}
.box p.note{font-size:.92rem;color:var(--muted);margin:.6em 0 0}
.src{font-size:.95rem;margin-top:3em}
.src::before{content:"Sumber";color:var(--muted)}
.src ul{margin:0;padding-left:1.1em}.src li{margin:.35em 0;color:var(--muted)}
mark{background:var(--mark);color:var(--ink);padding:0 .2em}
code{font-family:var(--f-mono);font-size:.82em;background:var(--accent-soft);padding:.08em .35em;color:#e6defa}
pre{font-family:var(--f-mono);font-size:.84rem;background:#0d0916;border:1px solid var(--line);padding:16px 18px;overflow-x:auto;line-height:1.65;max-width:76ch}
pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:1.4em 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums;font-size:.98rem}
th,td{border-bottom:1px solid var(--line);padding:8px 16px;text-align:center}
th{font:400 1.1rem var(--f-display);color:var(--ink)}
.katex{font-size:1.06em;color:inherit}
.katex-display{margin:0;overflow-x:auto;overflow-y:hidden}
mark .katex{font-size:1em}
.big .katex-display>.katex{font-size:1.25em}
.big{font:italic 400 clamp(1.3rem,2.4vw,1.7rem)/1.4 var(--f-body);color:var(--ink);text-align:center;padding:.6em 0;margin:1.2em 0;overflow-x:auto}

/* Widget: ilustrasi buku */
.viz{background:var(--sheet);padding:22px 24px 24px;margin:2.6em 0;max-width:none;position:relative}
.viz-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.viz-h b{font:italic 400 1.15rem var(--f-display);color:var(--cyan);font-weight:400}
.viz-h span{font:600 1.12rem/1.45 var(--f-body);color:var(--ink)}
.viz-c{display:flex;flex-wrap:wrap;gap:10px 24px;margin:16px 0;align-items:end}
.viz-c label{display:grid;gap:2px;font-size:.95rem;min-width:150px;flex:1 1 150px;color:var(--muted)}
.viz-c output{font-style:italic;color:var(--accent);font-variant-numeric:tabular-nums lining-nums}
.viz-c input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.viz-c button,.runbtn,.tool,.btn{display:inline-flex;align-items:center;gap:8px;font:400 .98rem var(--f-body);background:var(--raise);color:var(--ink);border:1px solid var(--line2);padding:7px 14px;cursor:pointer;min-height:38px;text-decoration:none;transition:border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
.viz-c button:hover,.runbtn:hover,.tool:hover,.btn:hover{border-color:var(--accent-line)}
.viz-c button:active,.runbtn:active,.tool:active,.btn:active{transform:translateY(1px)}
.viz-c button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.runbtn{background:transparent;color:var(--cyan);border-color:rgba(127,216,242,.45)}
.runbtn:disabled{opacity:.6;cursor:progress}
.viz svg{width:100%;height:auto;display:block;background:transparent;user-select:none}
.viz-out{font-size:1rem;margin-top:12px;line-height:1.6;color:var(--text)}
.viz .grid line{stroke:rgba(201,184,255,.07);stroke-width:1}
.viz .axis line{stroke:#6d6087;stroke-width:1.2}
.viz .tick text{font:italic 400 14px var(--f-body);fill:var(--muted)}
.viz .lbl{font:italic 400 15px var(--f-body);fill:var(--ink)}
.viz .line{fill:none;stroke-width:2.6;stroke-linecap:round}
.viz .s1.line{stroke:var(--s1)} .viz .s2.line{stroke:var(--s2)} .viz .ink.line{stroke:var(--ink)}
.viz .dash{stroke-dasharray:7 5} .viz .thick{stroke-width:5}
.viz .faint.line{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.viz .guide{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:3 4}
.viz .dot{stroke:var(--sheet);stroke-width:2.5}
.viz .s1.dot,.viz .s1.fill{fill:var(--s1)} .viz .s2.dot,.viz .s2.fill{fill:var(--s2)} .viz .ink.dot,.viz .ink.fill{fill:var(--ink)}
.viz .handle{cursor:grab}
.viz .area{fill-opacity:.16;stroke-width:1.4} .viz .s1.area{fill:var(--s1);stroke:var(--s1)} .viz .s2.area{fill:var(--s2);stroke:var(--s2)}
.viz .cell{fill:rgba(201,184,255,.06);stroke:var(--line2)}
.viz .s1t{fill:var(--s1)} .viz .s2t{fill:var(--s2)} .viz .faintt{fill:var(--muted)}
.dalam h2 small{display:block;font:italic 400 1.1rem var(--f-display);color:var(--cyan);margin-bottom:4px}
.runbar{display:flex;gap:12px;align-items:center;margin:-.4em 0 1.2em;flex-wrap:wrap}
.runbar small{color:var(--muted);font-size:.85rem;font-style:italic}
pre.hasil{border-style:dashed;border-color:rgba(127,216,242,.35);white-space:pre-wrap;color:var(--cyan)}

/* Sorotan mengikuti kursor */
.glow{position:relative;overflow:hidden;isolation:isolate}
.glow::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(201,184,255,.2),transparent 70%)}
.glow:hover::after{opacity:1}

/* Navigasi bawah & tombol */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4em;max-width:none}
.pager a{display:block;text-decoration:none;color:var(--ink);background:var(--sheet);padding:20px 24px;font:400 1.4rem/1.2 var(--f-display);border:1px solid var(--line)}
.pager a small{display:block;font:italic 400 .95rem var(--f-body);color:var(--muted);margin-bottom:6px}
.pager a:last-child{text-align:right}
.pager a:only-child{grid-column:2}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#ddd1ff}
.donebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:3em;padding-top:1.2em;border-top:1px solid var(--line);max-width:none}
.donebar .btn[aria-pressed=true]{background:transparent;color:var(--cyan);border-color:rgba(127,216,242,.5)}
.donebar small{color:var(--muted);font-style:italic}

/* Beranda */
.hero{position:relative;height:100svh;min-height:600px;margin:-110px calc(-1 * var(--gut)) 0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:24px;padding:80px var(--gut) 40px;overflow:hidden}
#heroc{position:absolute;inset:0;width:100%;height:100%}
.hero .hstage{position:absolute;z-index:1;transform:translateX(-50%);margin:0;text-align:center;display:grid;justify-items:center;gap:2px;width:min(420px,90vw);pointer-events:none;opacity:0}
.hero .hstage.in{animation:stIn 5.2s var(--ease) forwards}
.hero .hstage b{font:italic 400 .95rem var(--f-display);color:var(--cyan)}
.hero .hstage span{font:400 1.5rem/1.1 var(--f-display);color:var(--ink)}
.hero .hstage small{font:italic 400 .98rem/1.4 var(--f-body);color:var(--muted)}
@keyframes stIn{0%{opacity:0;transform:translate(-50%,8px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-width:430px){.brand{font-size:1.05rem!important}}
@media (max-width:900px){.hero .hstage{display:block;width:max-content}.hero .hstage small{display:none}.hero .hstage b{margin-right:6px}.hero .hstage span{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){.hero .hstage.in{animation:none;opacity:1}}
.hero .copy{position:relative;z-index:2;max-width:640px}
.hero h1{font:400 clamp(3rem,7.2vw,6.6rem)/.95 var(--f-display);color:var(--ink);letter-spacing:-.025em;margin:0 0 .3em;text-wrap:balance}
.hero h1 em{color:var(--accent)}
.hero .lede{font-size:clamp(1.05rem,1.5vw,1.25rem);color:var(--text);max-width:48ch;margin:0 0 1.8em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{min-height:48px;padding:10px 20px;font-size:1.05rem}
.hero .cap{margin:34px 0 0;font:italic 400 1.05rem var(--f-display);color:var(--muted)}
.hero .cap b{display:inline;margin-right:6px;font-weight:400;color:var(--cyan);font-size:1.3rem}
.home-body{max-width:1240px;margin:0 auto}
.home-body>section{margin-top:140px}
.home-body h2{font:400 clamp(2.2rem,4.5vw,3.6rem)/1.02 var(--f-display);color:var(--ink);margin:0 0 .5em;letter-spacing:-.015em;max-width:20ch}
.home-body h2 em{color:var(--accent)}
.idea{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.idea p{font-size:1.2rem;color:var(--text);margin:0}
.idea ul{list-style:none;margin:0;padding:0}
.idea li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font:400 1.35rem var(--f-display);color:var(--ink)}
.idea li span:nth-child(2){color:var(--muted);font-style:italic;font-size:1rem}
.idea li span:last-child{color:var(--accent);text-align:right}
.layers{list-style:none;padding:0;margin:0}
.layers li{display:grid;grid-template-columns:7rem minmax(0,1fr) minmax(0,1.2fr) 11rem;gap:28px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line)}
.layers .ln{font:italic 400 3.4rem/1 var(--f-display);color:rgba(201,184,255,.55)}
.layers li.has .ln{color:var(--accent)}
.layers b{font:400 1.8rem/1.1 var(--f-display);color:var(--ink);font-weight:400}
.layers .d{color:var(--muted);font-size:1rem;line-height:1.5}
.layers .pg{font-size:.9rem;color:var(--muted);font-style:italic}
.layers .pg i{display:block;height:4px;background:rgba(201,184,255,.12);margin-top:8px}
.layers .pg i s{display:block;height:100%;background:var(--cyan);text-decoration:none}
.layers a{color:inherit;text-decoration:none}
.howto{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px}
.howto ol{margin:0;padding-left:1.3em;font-size:1.1rem}
.howto li{margin:.2em 0 .9em;padding-left:.3em}
.howto li::marker{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:1.3rem}

/* Peta */

      '<p>Inilah urutan sebenarnya, lebih rinci daripada diagram. Setiap langkah mengerjakan beberapa pilar sekaligus (berselang-seling), lalu membangun satu benda AI, lalu memakainya di data nyata. Klik nama modul untuk melihat isi, sumber, dan tes lulusnya.</p>'+
      '<p class="legend"><span class="k-M"><i></i>M matematika</span><span class="k-S"><i></i>S statistika</span><span class="k-F"><i></i>F fisika</span><span class="k-K"><i></i>K komputasi</span><span class="k-B"><i></i>B bangun AI</span><span class="k-C"><i></i>C dunia nyata</span></p>'+
      steps+
      '<h2>Kapan boleh bilang "selesai"</h2><ol>'+P.selesai.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ol>'+
      '<div class="src"><ul><li>Urutan dan isi modul: PANDUAN-JALUR-INTI.md versi 2 (30 Okt 2026), hasil dua sesi council dan cek silang dengan silabus MIT 18.02, 18.05, 18.06, 8.333, dan Stanford CS229.</li><li>Diagram dibuat dengan Archify dan lolos validasi otomatis (validate, deliver, check, browser-check).</li></ul></div>'+
      '<div class="pager"><a class="glow" href="#beranda"><small>← Kembali</small>Beranda</a>'+(order[0]?'<a class="glow" href="#'+slug(order[0])+'"><small>Mulai belajar →</small>'+order[0]+' · '+L[order[0]].title+'</a>':'')+'</div>', true);
    seedF(AI_F);
  }

  /* Diagram Archify ikut tema situs */
  var ARCH_CSS = '[data-theme="dark"]{--bg:#150f22;--grid:#2a2040;--canvas-dot:rgba(201,184,255,.14);--text:#efeaf8;--text-muted:#a69cbd;--text-faint:#8f84a8;--panel:rgba(32,24,52,.55);--panel-border:#2e2446;--lane-fill:rgba(32,24,52,.3);--lane-stroke:#3d3160;--arrow:#7c6f9e;--arrow-emphasis:#7fd8f2;--mask:#1a1329;--database-stroke:#c9b8ff;--frontend-stroke:#7fd8f2;--toolbar-bg:rgba(24,18,38,.9);--toolbar-border:#3d3160;--toolbar-text:#efeaf8;--toolbar-hover:rgba(32,24,52,.95);--toolbar-menu-bg:#181226} .toolbar{display:none!important}'+
    'html,body{background:#150f22!important}h1,.title,header h1{font-family:"Instrument Serif",Georgia,serif!important;font-weight:400!important;letter-spacing:0!important}'+
    '::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a2d57}::-webkit-scrollbar-track{background:#150f22}';
  function bindPeta(){
    var fr = document.getElementById('petaFrame'), full = document.getElementById('petaFull'), desc = document.getElementById('petaDesc');
    var st = document.getElementById('stage'), sv = document.getElementById('stageView'), sz = document.getElementById('stageSizer');
    var zl = document.getElementById('stageZ'), fsb = document.getElementById('stageFs'), ttl = document.getElementById('stageTitle');
    if(!fr) return;
    var W = 1280, H = 900, k = 1, fitted = true;
    function isFs(){ return document.fullscreenElement === st || st.classList.contains('max'); }
    function fitK(){ var w = sv.clientWidth, h = isFs() ? sv.clientHeight : Infinity; return Math.max(.3, Math.min(w / W, h / H, isFs() ? 2 : 1)); }
    function apply(nk, keepCenter){
      var cx = (sv.scrollLeft + sv.clientWidth/2) / (W*k), cy = (sv.scrollTop + sv.clientHeight/2) / (H*k);
      k = Math.max(.3, Math.min(3, nk));
      fr.style.transform = 'scale('+k+')'; sz.style.width = (W*k)+'px'; sz.style.height = (H*k)+'px';
      if(!isFs()) st.style.setProperty('--sh', Math.min(H*k, window.innerHeight*.78)+'px');
      if(keepCenter){ sv.scrollLeft = cx*W*k - sv.clientWidth/2; sv.scrollTop = cy*H*k - sv.clientHeight/2; }
      zl.textContent = Math.round(k*100)+'%';
    }
    function fit(){
      fitted = true;
      /* layar penuh: diagram memakai seluruh layar dengan ukuran aslinya; mode biasa: kanvas 1280x900 diperkecil */
      if(isFs()){ W = sv.clientWidth; H = sv.clientHeight; } else { W = 1280; H = 900; }
      fr.style.width = W+'px'; fr.style.height = H+'px';
      apply(isFs() ? 1 : fitK(), false); sv.scrollLeft = 0; sv.scrollTop = 0;
    }
    function theme(){ try{ var d = fr.contentDocument; if(d && d.documentElement){ d.documentElement.setAttribute('data-theme','dark'); d.documentElement.style.colorScheme = 'dark';
      if(!d.getElementById('fondasi-tema')){ var s = d.createElement('style'); s.id = 'fondasi-tema'; s.textContent = ARCH_CSS; d.head.appendChild(s);
        var l = d.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap'; d.head.appendChild(l); } } }catch(e){} }
    fr.addEventListener('load', theme); theme();
    function pick(d, scroll){
      fr.src = d; full.href = d;
      var lab = 'Semua pilar · 6 tahap';
      [].forEach.call(view.querySelectorAll('.tabs button'), function(b){ var on = b.getAttribute('data-d') === d; b.setAttribute('aria-pressed', on); if(on) lab = b.getAttribute('title') || b.textContent; });
      ttl.textContent = lab;
      desc.textContent = (d.indexOf('cabang/') === 0 ? 'Satu baris = satu modul. Kotak dibaca dari kiri ke kanan; kotak paling kanan biasanya tes lulus atau jembatan ke modul berikutnya.' : 'Kolom = tahap (kiri ke kanan), baris = pilar. Tombol Jalur dan Lensa di pojok diagram membantu menelusuri.') + ' Seret untuk menggeser, Esc untuk keluar dari layar penuh.';
      fit();
      if(scroll) view.querySelector('.tabs').scrollIntoView({behavior: RM ? 'auto' : 'smooth'});
    }
    function setFsUi(){ var on = isFs(); fsb.innerHTML = ico(on?'exitfull':'full')+'<span>'+(on?'Keluar':'Layar penuh')+'</span>'; requestAnimationFrame(fit); }
    fsb.addEventListener('click', function(){
      if(isFs()){ if(document.fullscreenElement) document.exitFullscreen(); else { st.classList.remove('max'); document.body.style.overflow=''; setFsUi(); } return; }
      if(st.requestFullscreen) st.requestFullscreen().catch(function(){ st.classList.add('max'); document.body.style.overflow='hidden'; setFsUi(); });
      else { st.classList.add('max'); document.body.style.overflow='hidden'; setFsUi(); }
    });
    document.addEventListener('fullscreenchange', function(){ if(document.getElementById('stage') === st) setFsUi(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && st.classList.contains('max')){ st.classList.remove('max'); document.body.style.overflow=''; setFsUi(); } });
    [].forEach.call(st.querySelectorAll('[data-z]'), function(b){ b.addEventListener('click', function(){ var z = +b.getAttribute('data-z'); if(!z) return fit(); fitted = false; apply(k * (z > 0 ? 1.25 : 0.8), true); }); });
    /* seret untuk menggeser, hanya di area kosong panggung supaya klik di diagram tetap jalan */
    var drag = null;
    sv.addEventListener('pointerdown', function(e){ if(e.target !== sv && e.target !== sz) return; drag = {x:e.clientX, y:e.clientY, l:sv.scrollLeft, t:sv.scrollTop}; sv.classList.add('drag'); sv.setPointerCapture(e.pointerId); });
    sv.addEventListener('pointermove', function(e){ if(!drag) return; sv.scrollLeft = drag.l - (e.clientX - drag.x); sv.scrollTop = drag.t - (e.clientY - drag.y); });
    sv.addEventListener('pointerup', function(){ drag = null; sv.classList.remove('drag'); });
    fit();
    window.removeEventListener('resize', window._petaFit || fit); window._petaFit = function(){ if(fitted && document.getElementById('stage')) fit(); }; window.addEventListener('resize', window._petaFit);
    view.addEventListener('click', function(e){
      var b = e.target.closest('[data-d]'); if(!b) return;
      pick(b.getAttribute('data-d'), b.classList.contains('cablink'));
    });
  }

  function show(id){
    var x = L[id], i = order.indexOf(id), prev = order[i-1], next = order[i+1], dn = isDone(id);
    main.dataset.kind = 'lesson';
    frame(
      '<span class="chap" aria-hidden="true">'+id+'</span>'+
      '<p class="crumb">Pelajaran <b>'+id+'</b></p><h1>'+x.title+'</h1>'+
      '<p class="meta">Prasyarat: '+String(x.pre).replace(/\b(\d+\.\d+)\b/g, function(m){ return L[m] ? '<a href="#'+slug(m)+'">'+m+(isDone(m) ? ' '+ico('check') : '')+'</a>' : m; })+'</p>'+
      '<div class="why"><b>Kenapa penting untuk AI?</b>'+x.why+'</div>'+ x.body + (FIG[id] ? '<figure class="anat"><iframe src="'+FIG[id]+'" title="Gambar interaktif: neuron sebagai mesin" loading="lazy" data-fig="neuron"></iframe></figure>' : '') +
      dalam(id) +
      (x.src ? '<div class="src"><ul>'+x.src.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ul></div>' : '')+
      '<div class="donebar"><button type="button" class="btn glow" id="doneBtn" aria-pressed="'+dn+'">'+ico('check')+'<span>'+(dn?'Sudah selesai':'Tandai selesai')+'</span></button><small>Tandai setelah lulus Tes kertas kosong. Tersimpan di browser ini.</small></div>'+
      '<div class="pager">'+
        (prev ? '<a class="glow" href="#'+slug(prev)+'"><small>← Sebelumnya</small>'+prev+' · '+L[prev].title+'</a>' : '<a class="glow" href="#beranda"><small>← Kembali</small>Beranda</a>')+
        (next ? '<a class="glow" href="#'+slug(next)+'"><small>Berikutnya →</small>'+next+' · '+L[next].title+'</a>' : '')+
      '</div>');
    document.getElementById('doneBtn').addEventListener('click', function(){
      var a = getDone(), on = a.indexOf(id) < 0;
      if(on) a.push(id); else a = a.filter(function(v){ return v !== id; });
      setDone(a); this.setAttribute('aria-pressed', on); this.querySelector('span').textContent = on ? 'Sudah selesai' : 'Tandai selesai';
      buildToc(id);
    });
    if(window.mountViz) window.mountViz(view);
    addRunners(view);
    [].forEach.call(view.querySelectorAll('.ex .ans'), function(a){
      var d = document.createElement('details'); d.className = 'answ';
      d.innerHTML = '<summary>Lihat jawaban</summary>'; a.parentNode.insertBefore(d, a); d.appendChild(a);
    });
    outline();
    /* rumus latar diambil dari pelajaran ini, dicampur rumus AI */
    var own = [].map.call(view.querySelectorAll('.big, .rule mark'), function(e){ return e.textContent.trim(); }).filter(function(t){ return t.length > 2 && t.length < 26 && !/^(Hitung|Cari|Tentukan|Berapa)/.test(t); });
    seedF(own.length ? own.concat(own, AI_F.slice(0,4)) : AI_F, lessonEdge());
    texify(view);
  }

  /* KaTeX: rumus Unicode diganti tipografi matematika. Peta teks -> LaTeX ada di rumus.js. */
  var texRe = null;
  function tex(s, disp){ return window.katex.renderToString(s, {displayMode:!!disp, throwOnError:false, strict:false}); }
  function texify(root){
    var R = window.RUMUS;
    if(!R) return;
    if(!window.katex){ loadKatex().then(function(){ texify(root); }); return; }
    [].forEach.call(root.querySelectorAll('mark, .big'), function(el){
      var k = el.innerHTML.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '');
      var t = document.createElement('textarea'); t.innerHTML = k; k = t.value;
      var v = R.whole[k]; if(v) el.innerHTML = tex(v, el.classList.contains('big'));
    });
    [].forEach.call(root.querySelectorAll('code'), function(el){
      if(el.closest('pre')) return; var v = R.code[el.textContent]; if(!v) return;
      var sp = document.createElement('span'); sp.innerHTML = tex(v); el.replaceWith(sp);
    });
    if(!texRe){
      var keys = Object.keys(R.inline).sort(function(a, b){ return b.length - a.length; });
      texRe = new RegExp(keys.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
    }
    var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:function(n){
      return n.parentElement.closest('pre, code, .katex, svg, script, mark, .viz, button, .chap') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }}), nodes = [], n;
    while((n = walk.nextNode())) if(texRe.test(n.nodeValue)) nodes.push(n), texRe.lastIndex = 0; else texRe.lastIndex = 0;
    nodes.forEach(function(node){
      var s = node.nodeValue, frag = document.createDocumentFragment(), last = 0;
      s.replace(texRe, function(m, i){
        if(i > last) frag.appendChild(document.createTextNode(s.slice(last, i)));
        var sp = document.createElement('span'); sp.innerHTML = tex(R.inline[m]); frag.appendChild(sp);
        last = i + m.length;
      });
      if(last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.replaceWith(frag);
    });
  }
  var katexP = null;
  function loadKatex(){
    if(katexP) return katexP;
    katexP = new Promise(function(res){
      var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
      sc.onload = res; sc.onerror = function(){ katexP = null; res(); }; document.head.appendChild(sc);
    });
    return katexP;
  }

  function route(){
    if(heroStop){ heroStop(); heroStop = null; }
    var id = idFromHash();
    try{ if(id) localStorage.setItem('fondasi-terakhir', id); }catch(e){}
    buildToc(id);
    if(id) show(id); else if(location.hash==='#peta') { peta(); bindPeta(); } else home();
    openMenu(false); bar.classList.remove('hide');
    window.scrollTo(0,0); prog.style.width = '0';
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
